syntax = "proto3";

option csharp_namespace = "Test";

package test;

service TargetService {
  rpc QueryTargetCount (QueryTargetCountRequest) returns (TargetCountMsg);
  rpc QueryTargetInfo (QueryTargetInfoRequest) returns (TargetInfoMsg);
  
  rpc QueryConnectedTargetCount (QueryConnectedTargetCountRequest) returns (TargetCountMsg);
  rpc QueryConnectedTargetInfo (QueryConnectedTargetInfoRequest) returns (TargetInfoMsg);
  
  rpc ConnectTarget (ConnectTargetRequest) returns (TargetInfoMsg);
}

enum TargetResult {
  Success = 0;
  TargetNotFound = 1;
}

message QueryTargetCountRequest {
  /* ... */
}

message QueryTargetInfoRequest {
  int32 index = 1;
}

message QueryConnectedTargetCountRequest {
  /* ... */
}

message QueryConnectedTargetInfoRequest {
  int32 index = 1;
}

message ConnectTargetRequest {
  string serialNumber = 1;
}

message TargetCountMsg {
  TargetResult result = 1;
  int32 count = 2;
}

message TargetInfoMsg {
  TargetResult result = 1;
  string serialNumber = 2;
  string address = 3;
  string connectionType = 4;
}
