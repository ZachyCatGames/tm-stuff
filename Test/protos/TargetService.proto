syntax = "proto3";

option csharp_namespace = "Test";

package test;

import "TargetTypes.proto";
import "HtcsTypes.proto";

service TargetService {
  /* Connect / Disconnect. */
  rpc Connect (ConnectTargetRequest) returns (ConnectTargetReply);
  rpc Disconnect (DisconnectTargetRequest) returns (DisconnectTargetReply);
  rpc Close (CloseTargetRequest) returns (CloseTargetReply);

  /* HTCS Port Management. */
  //rpc QueryHtcsPortByName(QueryHtcsPortByNameRequest) returns (QueryHtcsPortByNameReply);
}

message ConnectTargetRequest {
  string serialNumber = 1;
}

message ConnectTargetReply {
  TargetResult result = 1;
  TargetInfo info = 2;
}

message DisconnectTargetRequest {
  /* ... */
}

message DisconnectTargetReply {
  TargetResult result = 1;
}

message QueryHtcsPortByNameRequest {
  string portName = 1;
}

message QueryHtcsPortByNameReply {
  TargetResult result = 1;
  htcs.PortInfo info  = 2;
}

message CloseTargetRequest {
  /* ... */
}

message CloseTargetReply {
  TargetResult result = 1;
}
