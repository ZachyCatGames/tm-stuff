syntax = "proto3";

option csharp_namespace = "Test";

package test;

import "protos/TargetTypes.proto";

service TargetManagerService {
  /* Client Context. */
  rpc InitializeUserContext (InitManagerClientContextRequest) returns (InitManagerClientContextReply);
  rpc FinalizeUserContext (FiniManagerClientContextRequest) returns (FiniManagerClientContextReply);
  
  /* Target Info. */
  rpc QueryTargetCount (QueryTargetCountRequest) returns (QueryTargetCountReply);
  rpc QueryTargetInfo (QueryTargetInfoRequest) returns (QueryTargetInfoReply);
  rpc QueryTargetInfoBySerial (QueryTargetInfoBySerialRequest) returns (QueryTargetInfoBySerialReply);
  rpc GetTargetUpdate (GetTargetUpdateRequest) returns (GetTargetUpdateReply);
}

message InitManagerClientContextRequest {
  /* ... */
}

message InitManagerClientContextReply {
  TargetResult result = 1;
  int32 contextId = 2;
}

message FiniManagerClientContextRequest {
  int32 contextId = 1;
}

message FiniManagerClientContextReply {
  TargetResult result = 1;
  int32 contextId = 2;
}

message QueryTargetCountRequest {
  QueryType type = 1;
  /* ... */
}

message QueryTargetCountReply {
  TargetResult result = 1;
  int32 count = 2;
}

message QueryTargetInfoRequest {
  QueryType type = 1;
  int32 maxCount = 2;
}

message QueryTargetInfoReply {
  TargetResult result = 1;
  repeated TargetInfo targets = 2;
}

message QueryTargetInfoBySerialRequest {
  string serialNumber = 1;
}

message QueryTargetInfoBySerialReply {
  TargetResult result = 1;
  TargetInfo info = 2;
}

message GetTargetUpdateRequest {
  int32 contextId = 1;
}

message GetTargetUpdateReply {
  TargetResult result = 1;
  TargetEventType eventType = 2;
  TargetInfo info = 3;
}
