syntax = "proto3";

option csharp_namespace = "Test";

package test;

enum TargetResult {
  TargetResult_Success = 0;
  TargetResult_TargetNotFound = 1;
  TargetResult_NotConnected = 2;
  TargetResult_InvalidSize = 3;
  TargetResult_InvalidIndex = 4;
  TargetResult_OperationCanceled = 5;
  TargetResult_InProgress = 6;
  TargetResult_InvalidContextId = 7;
  TargetResult_NotImplemented = 8;
  
  /* HTCS results. */
  TargetResult_PortNotFound = 1000;
}

enum TargetStatus {
  TargetStatus_Disconnected = 0;
  TargetStatus_Connected = 1;
  TargetStatus_Unplugged = 2;
}

enum QueryType {
  QueryType_Disconnected = 0;
  QueryType_Connected = 1;
  QueryType_All = 2;
  QueryType_Registered = 3;
}

message TargetInfo {
  string serialNumber = 1;
  string address = 2;
  string connectionType = 3;
  TargetStatus status = 4;
}

enum TargetEventType {
  TargetEventType_Connected = 0;
  TargetEventType_Disconnected = 1;
}
